<div class="row">
    <div class="col-md-12">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title">编辑用户 #{{.u.Id}}</h3>
            <div class="ibox-content">
                <form class="form-horizontal" onsubmit="return false;">
                    <input type="hidden" name="id" value="{{.u.Id}}">
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">用户名</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="username" value="{{.u.Username}}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">重置密码</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="password" name="password" placeholder="留空表示不修改密码">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">绑定邮箱</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="email" name="email" value="{{.u.Email}}" placeholder="留空表示解绑；全局唯一">
                            <span class="help-block m-b-none">直接修改不经过邮箱验证，仅建议超级管理员在替用户初始化或修改时使用。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">角色</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="role">
                                <option value="user" {{if eq .u.Role "user"}}selected{{end}}>普通用户</option>
                                <option value="super_admin" {{if eq .u.Role "super_admin"}}selected{{end}}>超级管理员</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">状态</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="status">
                                <option value="1" {{if eq true .u.Status}}selected{{end}}>启用</option>
                                <option value="0" {{if eq false .u.Status}}selected{{end}}>停用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">可用端口范围</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="allow_ports" value="{{.u.AllowPorts}}" placeholder="如 9001-9009,10001；留空表示继承全局白名单">
                            <span class="help-block m-b-none">仅对普通用户生效；只能收窄、不能超出 nps.conf 的全局 allow_ports。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">分配客户端</label>
                        <div class="col-sm-10">
                            {{range .clients}}
                            <label class="checkbox-inline" style="margin-right:14px;min-width:180px;">
                                <input type="checkbox" name="client_ids" value="{{.Id}}" {{if index $.selected .Id}}checked{{end}}>
                                #{{.Id}} {{.Remark}}
                            </label>
                            {{end}}
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold">备注</label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="remark" value="{{.u.Remark}}">
                        </div>
                    </div>
                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button" onclick="saveUser('{{.web_base_url}}/user/edit')">
                                <i class="fa fa-fw fa-lg fa-save"></i> 保存
                            </button>
                            <a class="btn btn-default" href="{{.web_base_url}}/user/list">返回</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function saveUser(url) {
        $.ajax({
            type: 'POST',
            url: url,
            data: $('form').serialize(),
            success: function (res) {
                alert(res.msg);
                if (res.status) window.location.href = '{{.web_base_url}}/user/list';
            }
        });
    }
</script>
