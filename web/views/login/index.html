<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title langtag="title-login"></title>

    <!-- Mainly scripts -->
    <!-- Latest compiled and minified CSS -->
    <link href="{{.web_base_url}}/static/css/fontawesome.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css" rel="stylesheet">

    <!-- Latest compiled and minified JavaScript -->
    <script src="{{.web_base_url}}/static/js/jquery-3.4.1.min.js"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js"></script>
    <!-- Latest compiled and minified Locales -->
    <script src="{{.web_base_url}}/static/js/language.js?v=20250528" type="text/javascript"></script>

</head>

<body class="gray-bg">
<div class="row border-bottom">
    <nav class="navbar navbar-static-top navbar-right" role="navigation" style="margin: 20px 40px">
        <div></div>
        <h1 style="margin:0px" class="navbar-header font-bold" langtag="application"></h1>
        <span class="btn-group dropdown">
                <button id="languagemenu" class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false"><i
                            class="fa fa-globe-asia fa-lg"></i><span></span></button>
                <ul class="dropdown-menu"></ul>
            </span>
    </nav>
</div>
<div class="loginColumns animated fadeInDown mt-3 px-5">
    <div class="row">

        <div class="col-md-6 mt-3">
            <h3 langtag="info-tagline"></h3>
            <ul class="px-1 text-justify">
                <li langtag="info-feature1"></li>
                <li langtag="info-feature2"></li>
                <li langtag="info-feature3"></li>
                <li langtag="info-feature4"></li>
                <li langtag="info-feature5"></li>
                <li langtag="info-feature6"></li>
                <li langtag="info-feature7"></li>
                <li langtag="info-feature8"></li>
                <li langtag="info-feature9"></li>
            </ul>
        </div>

        <div class="col-md-6 mt-3">
            <div class="ibox-content">
                {{if eq true .email_login_enable}}
                <ul class="nav nav-tabs" id="loginTabs">
                    <li class="active"><a href="#pwdLogin" data-toggle="tab">密码登录</a></li>
                    <li><a href="#emailLogin" data-toggle="tab">邮箱验证码</a></li>
                </ul>
                {{end}}
                <div class="tab-content" style="padding-top:18px;">
                    <div class="tab-pane active" id="pwdLogin">
                        <form id="pwdForm" class="m-t" onsubmit="return false">
                            <div class="form-group">
                                <input name="username" class="form-control" placeholder="username" required=""
                                       langtag="word-username">
                            </div>
                            <div class="form-group">
                                <input name="password" type="password" class="form-control" placeholder="password" required=""
                                       langtag="word-password">
                            </div>
                            {{if eq true .captcha_open}}
                                <div class="form-group">
                                    {{create_captcha}}
                                    <input name="captcha" class="form-control" placeholder="captcha" required=""
                                           langtag="word-captcha">
                                </div>
                            {{end}}
                            <button onclick="login()" class="btn btn-primary block full-width m-b"
                                    langtag="word-login"></button>
                            {{if eq true .register_allow}}
                                <p class="text-muted text-center"><small langtag="info-noaccount"></small></p>
                                <a class="btn btn-sm btn-white btn-block" href="{{.web_base_url}}/login/register"
                                   langtag="word-register"></a>
                            {{end}}
                        </form>
                    </div>
                    {{if eq true .email_login_enable}}
                    <div class="tab-pane" id="emailLogin">
                        <form id="emailForm" class="m-t" onsubmit="return false">
                            <div class="form-group">
                                <input id="login_email" name="email" type="email" class="form-control"
                                       placeholder="已绑定的邮箱" required="">
                            </div>
                            <div class="form-group">
                                <div class="input-group">
                                    <input id="login_code" name="code" class="form-control"
                                           placeholder="6 位验证码" required="">
                                    <span class="input-group-btn">
                                        <button id="sendLoginCode" type="button" class="btn btn-default"
                                                onclick="sendLoginCode()">获取验证码</button>
                                    </span>
                                </div>
                            </div>
                            <button onclick="emailLogin()" class="btn btn-primary block full-width m-b">登录</button>
                            <p class="text-muted"><small>验证码仅发往已绑定的邮箱；未绑定请先使用密码登录后到「账号与安全」中绑定。</small></p>
                        </form>
                    </div>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
    <hr/>
    <div class="footer" style="position: unset;">
        <div class="pull-right">
            <span langtag="word-readmore"></span> <strong><a href="https://ehang.io/nps" langtag="word-go"></a></strong>
        </div>
        <div><strong langtag="word-copyright"></strong> <span langtag="application"></span> &copy; 2018-2020</div>
    </div>
</div>

</body>
</html>


<script type="text/javascript">
    window.nps = {"web_base_url": {{.web_base_url}} }

    // Login Page Flipbox control
    function login() {
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/login/verify",
            data: $("#pwdForm").serializeArray(),
            success: function (res) {
                if (res.status) {
                    window.location.href = "{{.web_base_url}}/index/index"
                } else {
                    alert(res.msg)
                }
            }
        })
        return false
    }

    var resendSeconds = {{.email_code_resend_seconds}};
    var codeTimer = null;

    function countdown(btn, seconds) {
        var left = seconds;
        btn.disabled = true;
        btn.textContent = left + ' 秒后重发';
        clearInterval(codeTimer);
        codeTimer = setInterval(function () {
            left--;
            if (left <= 0) {
                clearInterval(codeTimer);
                btn.disabled = false;
                btn.textContent = '获取验证码';
            } else {
                btn.textContent = left + ' 秒后重发';
            }
        }, 1000);
    }

    function postForm(url, data, onOk) {
        $.ajax({
            type: "POST",
            url: url,
            data: data,
            success: function (res) {
                if (res.status && onOk) onOk(res);
                else if (!res.status) alert(res.msg);
            },
            error: function () { alert('请求失败，请稍后重试'); }
        });
    }

    function sendLoginCode() {
        var email = $.trim($('#login_email').val());
        if (!email) { alert('请输入邮箱'); return; }
        var btn = document.getElementById('sendLoginCode');
        postForm('{{.web_base_url}}/login/sendcode',
            {email: email, purpose: 'login'},
            function (res) { alert(res.msg); countdown(btn, resendSeconds); });
    }

    function emailLogin() {
        var email = $.trim($('#login_email').val());
        var code = $.trim($('#login_code').val());
        if (!email || !code) { alert('请输入邮箱和验证码'); return; }
        postForm('{{.web_base_url}}/login/emaillogin',
            {email: email, code: code},
            function () { window.location.href = '{{.web_base_url}}/index/index'; });
    }
</script>
</body>
</html>
