appname = nps
#Boot mode(dev|pro)
runmode = dev

#HTTP(S) proxy port, no startup if empty
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
https_just_proxy=true
#default https certificate setting
https_default_cert_file=conf/server.pem
https_default_key_file=conf/server.key

##bridge
bridge_type=tcp
bridge_port=8024
bridge_ip=0.0.0.0

# Public password, which clients can use to connect to the server
# After the connection, the server will be able to open relevant ports and parse related domain names according to its own configuration file.
public_vkey=123

#Traffic data persistence interval(minute)
#Ignorance means no persistence
flow_store_interval=1

# log level LevelEmergency->0  LevelAlert->1 LevelCritical->2 LevelError->3 LevelWarning->4 LevelNotice->5 LevelInformational->6 LevelDebug->7
log_level=6
log_path=nps.log

#Whether to restrict IP access, true or false or ignore
#ip_limit=true

#p2p
#p2p_ip=127.0.0.1
#p2p_port=6000

#web
web_host=a.o.com
web_username=admin
web_password=123
web_port = 8081
web_ip=0.0.0.0
web_base_url=
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
# if web under proxy use sub path. like http://host/nps need this.
#web_base_url=/nps

#Web API unauthenticated IP address(the len of auth_crypt_key must be 16)
#Remove comments if needed
#auth_key=test
auth_key=123
#获取服务端authKey时的aes加密密钥，16位
auth_crypt_key =213

# 服务端全局端口白名单（硬上限）。用户级 allow_ports 只能在此范围内收窄。
# 格式：9001-9009,10001,11000-12000；注释或留空表示不限制。
# 修改后执行 nps restart 或 nps reload 生效。
#allow_ports=9001-9009,10001,11000-12000

# ===== 端口池 =====
# 40000-49999：新建普通用户时自动分配连续 100 个专属端口，写入 users.json。
# 50000-60000：共享池，建隧道端口留空即随机分配；随机端口可在隧道列表一键
#              转为固定端口（PortPool="fixed"），此后永不归还、停用与重启都不换号。
# 端口池不改变全局 allow_ports，已有的老隧道端口完全不受影响；若启用了
# allow_ports 白名单，请把 40000-60000 一并纳入，否则新隧道无法分配端口。
# 设为 false 可一键回退到旧的随机探测行为。
port_pool_enable=true
port_pool_user_start=40000
port_pool_user_end=49999
port_pool_user_quota=100
port_pool_shared_start=50000
port_pool_shared_end=60000

# 独立用户体系：超级管理员(super_admin) / 普通用户(user)，数据存于 conf/users.json
# 首次启动自动把 web_username 迁移为超管、把旧客户端 web 账号迁移为普通用户。
# 设为 false 可一键回退到旧登录模式。
user_auth_enable=true

# 旧版兼容开关：客户端直登、自助注册、允许改用户名
allow_user_login=false
allow_user_register=false
allow_user_change_username=false

#extension
#流量限制
allow_flow_limit=true
#带宽限制
allow_rate_limit=true
#客户端最大隧道数限制
allow_tunnel_num_limit=true
allow_local_proxy=false
#客户端最大连接数
allow_connection_num_limit=true
#每个隧道监听不同的服务端端口
allow_multi_ip=true
system_info_display=true

#获取用户真实ip
http_add_origin_header=true

#cache
http_cache=false
http_cache_length=100

#get origin ip
#http_add_origin_header=false

#pprof debug options
#pprof_ip=0.0.0.0
#pprof_port=9999

#client disconnect timeout
disconnect_timeout=60

#管理面板开启验证码校验
open_captcha=false


# 是否开启tls
tls_enable=true
tls_bridge_port=8025

# ===== 邮箱绑定与邮箱验证码登录 =====
# 发信统一走中心邮件服务 https://t.jaxiu.cn/api/mail/v1（OAuth2
# client_credentials 换 token，再 POST /send）。本项目不再保存任何本地 SMTP
# 配置或发信凭据：租户凭据只从服务进程环境变量读取，不写入 nps.conf、不进仓库。
# Docker 部署用 -e 注入（或挂载 0600 密钥文件）：
#   NPS_MAIL_CLIENT_ID          必填，在 /mail-service 注册业务时拿到
#   NPS_MAIL_CLIENT_SECRET      必填，也可用 NPS_MAIL_CLIENT_SECRET_FILE 指向文件
#   NPS_MAIL_FROM               可选，默认 devtools@jaxiu.cn（中心服务自身发件人，已登记在白名单内）；
#                               换其它地址必须同步加进该业务的发件人白名单
#   NPS_MAIL_BASE_URL           可选，默认 https://t.jaxiu.cn/api/mail/v1
#   NPS_MAIL_SUBJECT_PREFIX     可选，默认 "[NPS] "
# 两项必填值齐备后登录页自动出现「邮箱验证码」入口；未配置则保持纯密码登录。
email_login_enable=true

# 验证码有效期（分钟）、重发间隔（秒）、最大错误次数、单 IP 每小时发送上限
email_code_ttl_minutes=10
email_code_resend_seconds=60
email_code_max_attempts=5
email_code_ip_limit=10